[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurel-research"
version = "0.1.0"
description = "Task-conditioned acoustic reliance through metamorphic testing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.45,<5", "accelerate>=0.34", "librosa>=0.10", "soundfile>=0.12"]

[project.scripts]
aurel = "aurel.cli:main"

[tool.setuptools.packages.find]
include = ["aurel*"]
